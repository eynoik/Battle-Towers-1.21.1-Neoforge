name: Publish alpha.6 prerelease

on:
  push:
    branches:
      - 'agent/worldgen-config-alpha6'
    paths:
      - '.github/workflows/publish-alpha6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha.6 target
        uses: actions/checkout@v5
        with:
          ref: ac4dabc75601352e30e0af6ff8a4e1075ec3853a

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build alpha.6
        shell: bash
        run: gradle build --no-daemon --stacktrace

      - name: Prepare release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" BattleTowers-1.21.1-NeoForge-alpha.6.jar

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.21.1-port-alpha.6 \
            BattleTowers-1.21.1-NeoForge-alpha.6.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target ac4dabc75601352e30e0af6ff8a4e1075ec3853a \
            --title "Battle Towers 1.21.1 NeoForge alpha.6" \
            --prerelease \
            --notes $'Pre-release test build of the Battle Towers port for Minecraft 1.21.1 NeoForge.\n\nChanges in alpha.6:\n- Netherrack Battle Towers no longer generate naturally in the Overworld.\n- Added worldgen spawnChancePercent to control overall natural tower frequency.\n- Added per-type natural Overworld spawn toggles for cobblestone, mossy cobblestone, sandstone, ice, smooth stone, and jungle towers.\n- Jungle natural generation remains disabled by default to preserve the previous alpha distribution.\n\nWorldgen settings are stored per world in serverconfig/battletowers-server.toml.\n\nThis is an alpha build intended for in-game testing.'
