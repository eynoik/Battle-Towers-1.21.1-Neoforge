modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AtomicStryker; NeoForge 1.21.1 port workspace by eynoik"
description='''
Porting workspace for AtomicStryker's Battle Towers targeting Minecraft 1.21.1 on NeoForge.
The original Forge-era Battle Towers source is preserved under legacy/1.12.2 as the reference implementation.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
